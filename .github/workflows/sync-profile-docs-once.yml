name: sync-profile-docs-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-profile-docs-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize profile documentation
        run: python scripts/sync-profile-docs-once.py
      - name: Commit documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document streamlined profile model"
          git push origin HEAD:main
