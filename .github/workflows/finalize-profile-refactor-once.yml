name: finalize-profile-refactor-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-profile-refactor-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final profile cleanup
        run: node scripts/finalize-profile-refactor-once.mjs
      - name: Commit final profile cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize streamlined profile"
          git push origin HEAD:main
