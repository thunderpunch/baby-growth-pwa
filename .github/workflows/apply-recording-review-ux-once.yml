name: apply-recording-review-ux-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-recording-review-ux-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recording review UX
        run: python scripts/apply-recording-review-ux-once.py
      - name: Run full verification
        run: node scripts/verify.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Land recording review UX"
          git push origin HEAD:main
