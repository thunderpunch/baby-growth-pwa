name: fix-history-health-temp-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-history-health-temp-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix history health summary
        run: python scripts/fix-history-health-temp-once.py
      - name: Run full verification
        run: node scripts/verify.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix history health summary edge"
          git push origin HEAD:main
