name: profile-refactor-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-refactor-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair staged patch script syntax
        run: sed -i 's/)));$/));/' scripts/apply-profile-slim-once.mjs
      - name: Apply profile refactor
        run: node scripts/apply-profile-slim-once.mjs
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor profile around derived routines"
          git push origin HEAD:main
